server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: activity-system-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/activity_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:activity}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:/mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.example.activity: INFO

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-jwt-secret-to-at-least-32-bytes}
    expiration: ${JWT_EXPIRATION:PT2H}

ai:
  deepseek:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    connect-timeout: ${AI_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${AI_READ_TIMEOUT:PT30S}
    max-tokens: ${AI_MAX_TOKENS:1200}
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:5}
